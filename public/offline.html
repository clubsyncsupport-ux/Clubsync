<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You're offline · ClubSync</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; background: #000; color: #f5f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  .card { max-width: 360px; }
  .icon { font-size: 40px; }
  h1 { font-size: 20px; margin: 12px 0 4px; }
  p { color: #a1a1a6; font-size: 14px; line-height: 1.5; }
  button { margin-top: 16px; background: #0d9488; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>ClubSync needs an internet connection to load your clubs, events, and service hours. Reconnect and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
